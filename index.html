<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 16px; }
    input { display: block; margin: 8px 0 16px; }
  </style>
</head>
<body>
  <h1>Simple Calculator</h1>
  <label for="number1">Enter Number 1</label>
  <input type="number" id="number1" step="any" required>
  <label for="number2">Enter Number 2</label>
  <input type="number" id="number2" step="any" required>

  <button type="button" onclick="calculate('+')">Add</button>
  <button type="button" onclick="calculate('-')">Subtract</button>
  <button type="button" onclick="calculate('*')">Multiply</button>
  <button type="button" onclick="calculate('/')">Divide</button>

  <p id="result" aria-live="polite">Result: </p>

  <script>
    function calculate(operation) {
      const input1 = document.getElementById('number1');
      const input2 = document.getElementById('number2');
      const result = document.getElementById('result');

      if (!input1.checkValidity() || !input2.checkValidity()) {
        result.textContent = 'Please enter two valid numbers.';
        return;
      }

      const number1 = Number(input1.value);
      const number2 = Number(input2.value);
      let answer;

      if (operation === '+') {
        answer = number1 + number2;
      } else if (operation === '-') {
        answer = number1 - number2;
      } else if (operation === '*') {
        answer = number1 * number2;
      } else if (operation === '/') {
        if (number2 === 0) {
          result.textContent = 'Cannot divide by zero.';
          return;
        }
        answer = number1 / number2;
      }

      result.textContent = 'Result: ' + answer;
    }
  </script>
</body>
</html>
